# La BD vive en Neon (tier gratuito permanente). Ver docs/render-setup.md.
services:
  - type: web
    name: nicarunner-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Connection string pooled de Neon. Setear manualmente en el dashboard
      # (Environment → Add) con la URI postgresql://... del pooler.
      - key: ConnectionStrings__PostgresConnection
        sync: false
      # NO usar generateValue: true — un re-aprovisionamiento del Blueprint
      # (o un suspend/resume del servicio) regenera el valor e invalida todos
      # los JWT en uso, tirando las sesiones de capturistas en medio de una
      # carrera. Setearlo manualmente una sola vez desde el dashboard de
      # Render (Environment → Add) con `openssl rand -base64 64`. Ver
      # docs/render-setup.md.
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: NicaRunner.Api
      - key: Jwt__Audience
        value: NicaRunner.Clients
      - key: Jwt__ExpiryMinutes
        value: "60"
      - key: Jwt__RefreshExpiryDays
        value: "30"
      # Envío de correos vía Resend (ver docs/render-setup.md). Ninguna de las
      # dos se fija acá: la llave es un secreto, y el remitente tiene que
      # pertenecer a un dominio verificado en resend.com/domains — fijarlo en el
      # blueprint haría que un re-sync pise el valor del dashboard.
      - key: Resend__ApiKey
        sync: false
      - key: Resend__FromEmail
        sync: false
      - key: Resend__Subject
        value: "Tu resultado en NicaRunner"
      - key: GoogleAuth__ClientId
        value: "450796447742-hi3dpbuo0i6k5jua6u31rqpgf7dpm06b.apps.googleusercontent.com"
      - key: Cors__AllowedOrigins__0
        sync: false
      # Secret que autoriza al cron de GitHub Actions a llamar
      # POST /api/admin/refresh-tokens/cleanup. Setearlo una vez con
      # `openssl rand -base64 32` y usar EL MISMO valor como GitHub Actions
      # secret ADMIN_CLEANUP_SECRET. Ver docs/render-setup.md.
      - key: Admin__CleanupSecret
        sync: false
