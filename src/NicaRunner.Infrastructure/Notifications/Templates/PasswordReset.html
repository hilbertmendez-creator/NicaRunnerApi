<p style="margin:0 0 16px;font-size:14px;color:{{ text_hi }};line-height:1.6;">
  Hola, <strong>{{ recipient_name }}</strong>
</p>
<p style="margin:0 0 24px;font-size:14px;color:{{ text_lo }};line-height:1.6;">
  Recibimos una solicitud para restablecer tu contraseña de NicaRunner Backoffice.
</p>
<table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:0 0 24px;">
  <tr>
    <td align="center" style="border-radius:{{ radius_btn }}px;background:linear-gradient(90deg, {{ cta_from }} 0%, {{ cta_to }} 100%);">
      <a href="{{ reset_url }}" target="_blank" style="display:inline-block;padding:12px 28px;font-size:14px;font-weight:500;color:#FFFFFF;text-decoration:none;border-radius:{{ radius_btn }}px;">
        Restablecer contraseña →
      </a>
    </td>
  </tr>
</table>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-bottom:24px;">
  <tr>
    <td style="background-color:{{ accent_bg }};border:1px solid {{ accent_border }};border-radius:{{ radius_btn }}px;padding:12px 16px;">
      <p style="margin:0;font-size:13px;color:{{ accent_text }};line-height:1.5;">
        ⓘ Este enlace es válido por {{ expires_minutes }} minutos.
      </p>
    </td>
  </tr>
</table>
<p style="margin:0;font-size:13px;color:{{ text_lo }};line-height:1.6;">
  Si no solicitaste esto, ignora este correo.
</p>
