<p style="margin:0 0 16px;font-size:14px;color:{{ text_hi }};line-height:1.6;">
  Hola, <strong>{{ recipient_name }}</strong>
</p>
<p style="margin:0 0 24px;font-size:14px;color:{{ text_lo }};line-height:1.6;">
  Se creó tu cuenta en <strong style="color:{{ text_hi }};">{{ product_name }}</strong>.
</p>
<p style="margin:0 0 8px;font-size:13px;font-weight:600;color:{{ text_lo }};">Contraseña temporal:</p>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-bottom:24px;">
  <tr>
    <td style="background-color:{{ accent_bg }};border:1px solid {{ accent_border }};border-radius:{{ radius_btn }}px;padding:14px 18px;">
      <code style="font-family:{{ font_mono }};font-size:16px;font-weight:600;color:{{ text_hi }};letter-spacing:0.5px;">{{ temp_password }}</code>
    </td>
  </tr>
</table>
<p style="margin:0;font-size:14px;color:{{ text_lo }};line-height:1.6;">
  Deberás cambiarla al iniciar sesión por primera vez.
</p>
