name: API CI

# Sin filtros de paths, a propósito. build-and-test es candidato a check requerido
# en la protección de main, y un check requerido que se saltea nunca reporta:
# GitHub deja el PR esperando un status que no va a llegar, sin timeout. Con
# `paths-ignore: frontend/**` eso pasaba en cualquier PR cuyo diff estuviera
# entero bajo frontend/**. Correrlo siempre cuesta ~1 min. Mismo criterio que
# frontend-ci.yml — si vas a filtrar por paths, no lo marques como requerido.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NicaRunner.sln

      - name: Build
        run: dotnet build NicaRunner.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/NicaRunner.Tests/NicaRunner.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"
