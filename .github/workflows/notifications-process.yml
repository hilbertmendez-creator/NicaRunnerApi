name: Process pending notifications

# NotifyAllAsync solo encola NotificationLog en Pendiente (para no bloquear
# el request con cientos de envíos secuenciales) — el envío real y los
# reintentos de fallidas los hace este cron, llamando al endpoint admin cada
# pocos minutos. Un corredor no debería esperar más que eso por su resultado.
#
# Requisitos en Settings → Secrets and variables → Actions (compartidos con
# el cron de refresh-token-cleanup, mismo secreto/variable, no hace falta
# configurar nada nuevo si ese cron ya está andando):
#   Secret:   ADMIN_CLEANUP_SECRET  — la misma cadena que en Render como
#             Admin__CleanupSecret.
#   Variable: RENDER_API_URL         — misma URL pública del servicio.
#
# Si el endpoint retorna algo distinto a 200 (401 por secret desalineado,
# 500 por bug del envío, etc.), el workflow falla — GitHub avisa por email.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar config
        env:
          URL: ${{ vars.RENDER_API_URL }}
          SECRET: ${{ secrets.ADMIN_CLEANUP_SECRET }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::Variable RENDER_API_URL no configurada."
            exit 1
          fi
          if [ -z "$SECRET" ]; then
            echo "::error::Secret ADMIN_CLEANUP_SECRET no configurado."
            exit 1
          fi
          echo "Target: $URL/api/admin/notifications/process-pending"

      - name: POST process-pending
        env:
          URL: ${{ vars.RENDER_API_URL }}
          SECRET: ${{ secrets.ADMIN_CLEANUP_SECRET }}
        run: |
          # --fail-with-body: sale con 22 si HTTP >= 400, imprime el body
          # de error igual (útil para debug del 401 vs 500).
          # --max-time 120: el envío a Resend/WhatsApp de varias notificaciones
          # pendientes puede tardar; 2 min es margen amplio.
          RESPONSE=$(curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST \
            -H "X-Admin-Secret: $SECRET" \
            "$URL/api/admin/notifications/process-pending")
          echo "Process-pending result: $RESPONSE"
