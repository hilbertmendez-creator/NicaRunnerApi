name: Stale race sweep

# Guardia anti-zombie: una carrera EnCurso nunca debería quedar olvidada para
# siempre. Este cron llama al endpoint admin que detecta carreras EnCurso sin
# actividad de captura hace 12h o más y notifica por email a todos los
# Administradores — nunca cierra nada, solo alerta (un humano decide).
# El umbral de 12h no justifica un cron de minutos: cada 3 horas es margen
# suficiente para que la alerta llegue con horas de sobra antes de que
# alguien note la carrera abandonada al día siguiente.
#
# Requisitos en Settings → Secrets and variables → Actions (compartidos con
# los otros crons admin, no hace falta configurar nada nuevo):
#   Secret:   ADMIN_CLEANUP_SECRET  — la misma cadena que en Render como
#             Admin__CleanupSecret.
#   Variable: RENDER_API_URL         — misma URL pública del servicio.
#
# Si el endpoint retorna algo distinto a 200 (401 por secret desalineado,
# 500 por bug, etc.), el workflow falla — GitHub avisa por email.

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar config
        env:
          URL: ${{ vars.RENDER_API_URL }}
          SECRET: ${{ secrets.ADMIN_CLEANUP_SECRET }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::Variable RENDER_API_URL no configurada."
            exit 1
          fi
          if [ -z "$SECRET" ]; then
            echo "::error::Secret ADMIN_CLEANUP_SECRET no configurado."
            exit 1
          fi
          echo "Target: $URL/api/admin/races/stale-sweep"

      - name: POST races/stale-sweep
        env:
          URL: ${{ vars.RENDER_API_URL }}
          SECRET: ${{ secrets.ADMIN_CLEANUP_SECRET }}
        run: |
          # --fail-with-body: sale con 22 si HTTP >= 400, imprime el body de
          # error igual (útil para debug del 401 vs 500).
          RESPONSE=$(curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST \
            -H "X-Admin-Secret: $SECRET" \
            "$URL/api/admin/races/stale-sweep")
          echo "Stale-sweep result: $RESPONSE"
